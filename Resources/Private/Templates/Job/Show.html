<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="content">
    <f:if condition="{job}">
        <f:render partial="Job/Properties" arguments="{job: job}" />
        <f:if condition="{settings.job.returnToPid}">
            <p>
                <f:link.page pageUid="{settings.job.returnToPid}"><f:translate key="LLL:EXT:google_for_jobs/Resources/Private/Language/locallang.xlf:show.backToList" /></f:link.page>
            </p>
        </f:if>
    </f:if>
</f:section>
</html>
