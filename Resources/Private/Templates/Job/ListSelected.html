<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="content">
    <div class="tx-google-for-jobs-list-selected">
        <f:if condition="{jobs}">
            <f:then>
                <ul>
                    <f:for each="{jobs}" as="job">
                        <f:render partial="Job/ListItem" arguments="{job: job, settings: settings}" />
                    </f:for>
                </ul>
            </f:then>
            <f:else>
                <f:render partial="Job/NoJobsSelected" />
            </f:else>
        </f:if>
    </div>
</f:section>
</html>
