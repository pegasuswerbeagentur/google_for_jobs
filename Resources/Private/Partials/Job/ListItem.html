<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<li>
    <f:link.action action="show" arguments="{job: job}" pageUid="{settings.job.detailPid}">{f:if(condition: job.alternativeTitle, then: job.alternativeTitle, else: job.title)}</f:link.action>
    <f:if condition="{job.employmentTypes}">
        <br />
        <f:for each="{job.employmentTypes}" as="employmentType" iteration="iteration">
            <f:translate key="LLL:EXT:google_for_jobs/Resources/Private/Language/locallang_db.xlf:tx_googleforjobs_domain_model_job.employment_type_{employmentType -> f:format.case(mode: 'lower')}" default="{employmentType}" />{f:if(condition: iteration.isLast, else: ', ')}
        </f:for>
    </f:if>
    <f:for each="{job.jobLocations}" as="jobLocation">
        <br />{jobLocation.postalCode} {jobLocation.city}
    </f:for>
</li>
</html>
