name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and static analysis (TYPO3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3: ['^13.4.37', '^14.3.10']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --with "typo3/cms-core:${{ matrix.typo3 }}"

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: PHP syntax
        run: find Classes Configuration Tests ext_*.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Coding guidelines
        run: composer ci:cgl

      - name: PHPStan
        run: composer ci:phpstan

  tests:
    name: Tests (TYPO3 ${{ matrix.typo3 }}, PHP ${{ matrix.php }}, ${{ matrix.db || 'sqlite' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - typo3: '^13.4.37'
            php: '8.2'
          - typo3: '^13.4.37'
            php: '8.3'
          - typo3: '^13.4.37'
            php: '8.4'
          - typo3: '^14.3.10'
            php: '8.2'
          - typo3: '^14.3.10'
            php: '8.3'
          - typo3: '^14.3.10'
            php: '8.4'
          - typo3: '^14.3.10'
            php: '8.5'
          - typo3: '^13.4.37'
            php: '8.4'
            db: mariadb
          - typo3: '^14.3.10'
            php: '8.4'
            db: mariadb
    services:
      mariadb:
        image: ${{ matrix.db == 'mariadb' && 'mariadb:10.11' || '' }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TYPO3_PATH_ROOT: ${{ github.workspace }}/.Build/public
      TYPO3_PATH_APP: ${{ github.workspace }}/.Build
      typo3DatabaseDriver: ${{ matrix.db == 'mariadb' && 'mysqli' || 'pdo_sqlite' }}
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
      typo3DatabaseName: typo3
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mysqli, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --with "typo3/cms-core:${{ matrix.typo3 }}"

      - name: Unit tests
        run: composer ci:tests:unit

      - name: Functional tests
        run: composer ci:tests:functional
